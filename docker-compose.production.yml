services:
  db:
    ports: !reset []
  api:
    ports: !reset []
    environment:
      App__SecureCookies: "true"
      App__SiteUrl: "https://${SITE_ADDRESS:-finance.internal}"
      AllowedHosts: "${SITE_ADDRESS:-finance.internal};localhost"
  frontend:
    ports: !override
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-finance.internal}
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile.production", "--adapter", "caddyfile"]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
