name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=""
          if [ -n "$BASE_REF" ]; then
            base="origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          fi
          if [ -z "$base" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$base" HEAD)
          shared="^(\.gitea/|\.editorconfig|\.dockerignore|\.env\.example|global\.json|docker-compose|justfile|lefthook\.yml|scripts/)"
          backend=false
          frontend=false
          if echo "$files" | grep -qE "^backend/|$shared"; then backend=true; fi
          if echo "$files" | grep -qE "^frontend/|$shared"; then frontend=true; fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.gitea/actions/setup-dotnet

      - name: Restore
        run: dotnet restore backend/JxFinance.slnx

      - name: Vulnerable NuGet packages
        run: node scripts/audit.mjs --backend

      - name: Restore tools
        working-directory: backend
        run: dotnet tool restore

      - name: Format and code style
        run: node scripts/format-backend.mjs --check --no-restore

      - name: Build
        run: dotnet build backend/JxFinance.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution backend/JxFinance.slnx --configuration Release --no-build --report-xunit-trx --results-directory backend/TestResults --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: backend-test-results
          path: backend/TestResults
          retention-days: 7

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.gitea/actions/setup-frontend

      - name: Vulnerable shipped packages (development packages are reported only)
        run: node ../scripts/audit.mjs --frontend

      - name: Lint
        run: nub run lint

      - name: Format check
        run: nub run format:check

      - name: Unit, DOM and story tests with coverage
        run: nub run test:coverage

      - name: Build
        run: nub run build

      - name: Build Storybook
        run: nub run build-storybook

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 7

  client-drift:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.gitea/actions/setup-dotnet

      - uses: ./.gitea/actions/setup-frontend

      - name: Fail on contract or client drift
        run: node scripts/gen.mjs --check

  production-overlay:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Base images are pinned by digest
        run: |
          if grep -hE '^FROM |^ +image: ' docker-compose.yml backend/JxFinance.Api/Dockerfile frontend/Dockerfile | grep -vE '@sha256:[0-9a-f]{64}'; then
            echo "::error::Every base image must be pinned as name:tag@sha256:digest. Run 'just update-images'."
            exit 1
          fi

      - name: Validate the Caddyfiles
        run: |
          caddy_image=$(grep -oE 'caddy:[^ ]+@sha256:[0-9a-f]{64}' frontend/Dockerfile)
          for file in Caddyfile Caddyfile.production; do
            docker run --rm -i "$caddy_image" sh -c 'cat > /tmp/Caddyfile && caddy validate --config /tmp/Caddyfile --adapter caddyfile' < "frontend/$file"
          done

      - name: Verify the production overlay
        run: |
          cp .env.example .env
          node scripts/verify-production.mjs

  e2e:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_COMPOSE: docker compose -f docker-compose.yml -f docker-compose.e2e.yml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.gitea/actions/setup-frontend

      - name: Install Playwright browser
        working-directory: frontend
        run: nub exec playwright install --with-deps chromium

      - name: Start the throwaway stack
        run: |
          cp .env.example .env
          $E2E_COMPOSE up -d --build --wait

      - name: Smoke tests
        working-directory: frontend
        env:
          CI: "true"
        run: nub run e2e

      - name: Stack logs
        if: failure()
        run: $E2E_COMPOSE logs --no-color --tail 200

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: $E2E_COMPOSE down --volumes
