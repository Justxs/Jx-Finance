name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore backend/JxFinance.slnx

      - name: Build
        run: dotnet build backend/JxFinance.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test backend/JxFinance.slnx --configuration Release --no-build --logger "console;verbosity=normal"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup nub and Node
        uses: nubjs/setup-nub@v0
        with:
          nub-version: "0.9.2"
          node-version: 24
          working-directory: frontend
          cache: true
          cache-dependency-path: frontend/nub.lock

      - name: Install
        run: nub ci

      - name: Lint
        run: nub run lint

      - name: Test
        run: nub run test

      - name: Format check
        run: nub run format:check

      - name: Build
        run: nub run build

  client-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup nub and Node
        uses: nubjs/setup-nub@v0
        with:
          nub-version: "0.9.2"
          node-version: 24
          working-directory: frontend
          cache: true
          cache-dependency-path: frontend/nub.lock

      - name: Install frontend deps
        working-directory: frontend
        run: nub ci

      - name: Export OpenAPI document
        env:
          ConnectionStrings__Default: "Host=localhost;Database=export;Username=export;Password=export"
        run: dotnet run --project backend/JxFinance.Api -c Release --export-openapi-docs true -p:PublishAot=false

      - name: Copy spec for codegen
        run: cp backend/JxFinance.Api/wwwroot/openapi/v1.json frontend/openapi.json

      - name: Regenerate client
        working-directory: frontend
        run: |
          nub run orval
          nub run format src/api/generated

      - name: Fail on client drift
        run: |
          if ! git diff --quiet -- frontend/src/api/generated; then
            echo "::error::Generated API client is out of date. Run 'just gen' and commit the result."
            git diff -- frontend/src/api/generated
            exit 1
          fi
