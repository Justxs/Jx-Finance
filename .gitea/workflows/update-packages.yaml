name: Update packages

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: update-packages
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  UPDATE_BRANCH: chore/package-updates
  BASE_BRANCH: master

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.BASE_BRANCH }}
          token: ${{ secrets.PACKAGE_UPDATE_TOKEN }}

      - uses: ./.gitea/actions/setup-dotnet
        with:
          cache: "false"

      - uses: ./.gitea/actions/setup-frontend
        with:
          install: "false"

      - name: Update NuGet packages
        run: |
          dotnet tool install --global dotnet-outdated-tool
          export PATH="$PATH:$HOME/.dotnet/tools"
          for project in backend/*/*.csproj; do
            dotnet outdated "$project" --upgrade
          done
          dotnet restore backend/JxFinance.slnx

      - name: Update frontend packages
        working-directory: frontend
        run: |
          nub update --latest
          nub add @tanstack/react-form@alpha
          nub install

      - name: Update pinned Docker base images
        run: node scripts/update-images.mjs

      - name: Regenerate API client
        run: node scripts/gen.mjs

      - name: Detect changes
        id: changes
        run: |
          git add -A backend frontend docker-compose.yml
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push update branch
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "package-updater"
          git config user.email "package-updater@noreply.${GITHUB_SERVER_URL#https://}"
          git checkout -B "$UPDATE_BRANCH"
          git commit -m "chore(deps): update packages and base images"
          git push --force origin "$UPDATE_BRANCH"

      - name: Open pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          TOKEN: ${{ secrets.PACKAGE_UPDATE_TOKEN }}
        run: |
          manifest_diff=$(git diff "origin/$BASE_BRANCH" HEAD --unified=0 -- backend/Directory.Packages.props 'backend/**/*.csproj' backend/dotnet-tools.json frontend/package.json docker-compose.yml backend/JxFinance.Api/Dockerfile frontend/Dockerfile | grep -E '^[+-][^+-]' || true)
          body=$(printf 'Automated package update.\n\nCI runs on this pull request. Review the changelogs of any major version bumps before merging.\n\n```diff\n%s\n```\n' "$manifest_diff")
          payload=$(jq -n --arg title "chore(deps): update packages" --arg head "$UPDATE_BRANCH" --arg base "$BASE_BRANCH" --arg body "$body" '{title: $title, head: $head, base: $base, body: $body}')
          status=$(curl -sS -o response.json -w '%{http_code}' -X POST \
            -H "Authorization: token $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY/pulls")
          if [ "$status" = "201" ]; then
            echo "Pull request opened: $(jq -r .html_url response.json)"
          elif [ "$status" = "409" ]; then
            echo "Pull request already open; branch was refreshed."
          else
            echo "::error::Gitea returned $status"
            cat response.json
            exit 1
          fi
