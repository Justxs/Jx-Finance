name: Setup frontend
description: Install Vite+ and Node and the frontend packages from the lockfile.

inputs:
  install:
    description: Run a frozen vp install in frontend.
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup Vite+ and Node
      uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
      with:
        working-directory: frontend
        node-version: 24
        cache: true
        run-install: "false"

    - name: Install frontend packages
      if: inputs.install == 'true'
      shell: bash
      working-directory: frontend
      run: vp install --frozen-lockfile
