name: Setup frontend
description: Install Vite+ and Node and the frontend packages from the lockfile.

inputs:
  install:
    description: Run a frozen vp install in frontend.
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup Vite+ and Node
      uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
      with:
        working-directory: frontend
        node-version: 24
        cache: true
        run-install: "false"

    - name: Install frontend packages
      if: inputs.install == 'true'
      shell: bash
      working-directory: frontend
      run: vp install --frozen-lockfile
