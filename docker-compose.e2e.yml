name: jx-e2e

services:
  db:
    ports: !reset []
    volumes: !override
      - e2e_db_data:/var/lib/postgresql/data

  api:
    ports: !reset []
    volumes: !override
      - e2e_auth_keys:/keys
      - e2e_backups:/backups

  frontend:
    ports: !override
      - "127.0.0.1:8089:80"
    environment:
      TRUSTED_PROXIES: private_ranges

volumes:
  e2e_db_data:
  e2e_auth_keys:
  e2e_backups:
