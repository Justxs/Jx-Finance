x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16.15@sha256:a3b7f434b2dc57ce85a67e171163eb8ab1a1ebcb39d27484661f26b1dfbe30d6
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    restart: unless-stopped
    logging: *logging
    build:
      context: .
      dockerfile: backend/JxFinance.Api/Dockerfile
    environment:
      App__DataProtectionDirectory: /keys
      App__BackupDirectory: /backups
      App__AttachmentDirectory: /attachments
      App__ImportInbox: /import-inbox
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    env_file:
      - .env
    ports:
      - "127.0.0.1:8091:8080"
    volumes:
      - auth_keys:/keys
      - backups:/backups
      - attachments:/attachments
      - import_inbox:/import-inbox
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    restart: unless-stopped
    logging: *logging
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8081:80"
    volumes:
      - maps:/srv/maps:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  aspire:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.0@sha256:064b50d557fcaffd10f06bf79ba4069bd50994a84034f1a0fc35c165500482d7
    restart: unless-stopped
    logging: *logging
    profiles:
      - telemetry
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
      Dashboard__TelemetryLimits__MaxLogCount: "100000"
    ports:
      - "127.0.0.1:18888:18888"
      - "127.0.0.1:4317:18889"

volumes:
  db_data:
  auth_keys:
  backups:
  attachments:
  import_inbox:
  maps:
