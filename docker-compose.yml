services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/JxFinance.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      App__DataProtectionDirectory: /keys
    env_file:
      - .env
    ports:
      - "127.0.0.1:8091:8080"
    volumes:
      - auth_keys:/keys
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8081:80"
    depends_on:
      api:
        condition: service_healthy

  aspire:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.5
    restart: unless-stopped
    profiles:
      - telemetry
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "127.0.0.1:18888:18888"
      - "127.0.0.1:4317:18889"

volumes:
  db_data:
  auth_keys:
