<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#f1f3f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1115" media="(prefers-color-scheme: dark)" />
    <meta name="application-name" content="Jx Finance" />
    <meta name="apple-mobile-web-app-title" content="Jx Finance" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Jx Finance, a private household ledger." />
    <title>Jx Finance</title>
    <link rel="preload" href="/brand/mark.svg" as="image" type="image/svg+xml" />
    <script src="/theme-init.js"></script>
  </head>

  <body>
    <div id="root">
      <div
        class="fixed inset-0 z-50 grid place-items-center bg-background"
        role="status"
        aria-label="Loading"
      >
        <div class="relative grid size-32 place-items-center">
          <div class="absolute inset-0 rounded-full border-2 border-border"></div>
          <div
            class="absolute inset-0 animate-spin rounded-full border-2 border-transparent border-t-primary motion-reduce:animate-none"
          ></div>
          <div
            class="aspect-[375/271] w-16 bg-primary mask-[url(/brand/mark.svg)] mask-contain mask-center mask-no-repeat"
          ></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
