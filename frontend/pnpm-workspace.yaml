allowBuilds:
  esbuild: true
  lefthook: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5
  vite-plus: 1.4.0
  "@vitest/coverage-v8": 5.0.5
minimumReleaseAgeExclude:
  - "@tanstack/hotkeys@0.24.0"
  - "@tanstack/react-hotkeys@0.22.0"
  - "@vitejs/plugin-react@6.2.1"
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
    - vite-plus
  allowedVersions:
    vite: "*"
    vitest: "*"
